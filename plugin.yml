# Canonical descriptor for the mate plugin — edit here, never plugin.json.
# shipyard's project job projects this into .claude-plugin/plugin.json and the
# marketplace SPA (the suite: block), and commits the result to the branch.

name: mate
version: 0.3.1
description: "Fix and feature playbooks that start on their own when tack opens an issue."
author: chris-peterson
repository: https://github.com/chris-peterson/mate
keywords: [fix, feature, debugging, tdd, refine, workflow, claude-code]
license: MIT

# mate needs anchor and tack, but doesn't declare them: Claude Code resolves a
# bare dependency name in mate's own marketplace only, so a sibling installed
# from a marketplace that proxies it (getty-claude-marketplace carries anchor)
# leaves mate disabled with `Dependency "anchor@chris-peterson" is not
# installed`. Restore the block once every marketplace that carries mate also
# carries both siblings. suite.dependencies keeps them on the site.
# dependencies:
#   - name: anchor
#   - name: tack

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It points at AGENTS.md, which every agent reads.

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/mate/#/

# mate publishes nothing: it causes no artifact a sibling could act on. It hears
# the keys that join two plugins. The two anchor keys mostly name steps inside
# anchor's own chain and move into anchor with anchor#164; until then mate
# carries them.
events:
  subscribes:
    - key: codes.bridgeai.anchor/commit.pushed
      handled_by: hooks/react.sh
      reason: >-
        it lands after the push, which is downstream of the commit's own review
        gate. Only an approved verdict commits and pushes, so the announcement
        is itself evidence the diff was read, and the line can name the step
        after review instead of another review. It also carries the branch,
        which is what decides whether there is a change request to open at all
    - key: codes.bridgeai.anchor/cr.ready
      handled_by: hooks/react.sh
      reason: >-
        the draft flag coming off is the first moment the change request is
        something to hand to somebody, and the announcement carries the URL to
        hand over
    - key: codes.bridgeai.tack/session.started
      handled_by: hooks/react.sh
      reason: >-
        tack owns starting work, and this is tack saying a session has just
        been bound to a route. The line has the agent classify that work and
        start /mate:fix or /mate:feature, so opening an issue with /tack:start
        is all it takes. Listening for the announcement rather than the name of
        tack's skill leaves tack free to rename or reshape the skill

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  group: waypoints
  # The siblings mate needs installed, with the reason for each.
  dependencies:
    - name: tack
      required: true
      reason: announces when work opens on an issue, and records the work that spans more than one deliverable
    - name: anchor
      required: true
      reason: announces a push and a change request leaving draft, and supplies the commands mate names after each
  # Two user-invoked skills, and one hook that starts them when tack opens work
  # and names the step after anchor's push and draft flag. Nothing at session
  # start.
  activations: [agent, user]
  gloss: mate plugins to combine capabilities.
  pitch: "Opened an issue with tack? mate decides whether it's a fix or a feature and starts it."
  what: "mate carries the playbooks for the work where code actually changes: a defect whose cause is not known yet, and a capability that is not there yet. When tack opens work on an issue, it has the agent decide which playbook fits and start it. And when anchor pushes a commit or takes a change request out of draft, it names what comes next. It acts only where the command you ran already says what you want."
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      feature: Add a capability to an existing codebase — gather the constraints that prevent false starts, implement one feature at a time against the repo's existing patterns, verify each against real feedback, then consolidate before merge.
      fix: Diagnose a bug whose cause isn't known yet — root-cause it, prove the fix against something that failed before it (a new test, or the CI run that already did), then sweep for the same bug class.
    hooks:
      hooks: 'Hook wiring: PostToolUse→react (Bash).'
      react: PostToolUse — Starts /mate:fix or /mate:feature once tack opens work on a route, and names the step after anchor's push and draft flag.
  # <<< shipyard:describe <<<
  examples:
    - label: "Opening work on an issue"
      ac: "--orient"
      frames:
        - { t: you, text: "/tack:start https://github.com/acme/api/issues/412" }
        - { t: claude, text: "Route opened. The issue is labelled `bug` and the description has a stack trace with no known cause — that's a defect, so `/mate:fix` is the fit rather than `/mate:feature`. Starting it now." }
        - { t: status, text: "mate classified it and the agent started /mate:fix" }
    - label: "Fixing a production issue"
      ac: "--green"
      frames:
        - { t: you, text: "/mate:fix the 500 on empty POST bodies" }
        - { t: claude, text: "RED confirmed (3 tests fail against current code) → GREEN. Root cause: payload validation is skipped when Content-Length is 0. Swept four sibling handlers; one had the same gap." }
        - { t: status, text: "diagnosed first; no branch or route opened for a one-commit fix" }
  session:
    - { t: you, text: "/tack:start https://github.com/acme/api/issues/412" }
    - { t: event, text: "tack opens the route and announces session.started" }
    - { t: claude, text: "The issue has a stack trace and no known cause, so it's a defect. Starting /mate:fix." }
    - { t: cmd, cmd: "/mate:fix", out: "diagnosis → fix → the failing job passes → sweep" }
    - { t: note, text: "mate's one automatic move: picking the playbook once tack has opened the work." }

docs:
  code_languages: [bash, json, yaml, markdown]
  mermaid: true
