# Source of record for mate's hooks — shipyard generates hooks.json.
#
# react.sh takes `Bash`, because the suite announces what it did on a command's
# stdout, and that reaches a subscriber only through the tool call that printed
# it.
hooks:
  - event: PostToolUse
    matcher: Bash
    command: 'bash "${CLAUDE_PLUGIN_ROOT}/hooks/react.sh"'
    description: Starts /mate:fix or /mate:feature once tack opens work on a route, and names the step after anchor's push and draft flag.
