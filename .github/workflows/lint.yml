name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners. Gates at the
      # default severity (info and up) — both scripts are a zero-finding
      # baseline, so any new finding fails.
      - name: shellcheck
        run: shellcheck hooks/*.sh scripts/tests/*.sh
