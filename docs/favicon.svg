<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mate">
  <rect width="64" height="64" rx="14" fill="#282a36"/>
  <!-- A dovetail, seated. The tail leaves its board narrow and arrives wide, so
       the wide end cannot pass back through the socket mouth and the joint holds
       against the one pull that matters. Both boards are cut from the same seam
       path, which is why the tail is the socket.

       The seam sits at x=26.33 rather than the middle: the tail adds 204 square
       units to the left board, so the boundary moves left by half that over the
       height to leave the two colours an even split.

       The kerf is stroked in the tile's own ground, because cyan and green sit
       at nearly the same luminance — the hue boundary alone disappears at 16px
       and in greyscale, and the kerf is what carries the joint at both. -->
  <path d="M8 14 H26.33 V27 L38.33 20 V44 L26.33 37 V50 H8 Z" fill="#8be9fd"/>
  <path d="M56 14 H26.33 V27 L38.33 20 V44 L26.33 37 V50 H56 Z" fill="#50fa7b"/>
  <path d="M26.33 14 V27 L38.33 20 V44 L26.33 37 V50"
        fill="none" stroke="#282a36" stroke-width="3.6" stroke-linejoin="round"/>
</svg>
